name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout pinned sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build and patch pinned WeChat adapter
        run: |
          npm --prefix vendor/cli-in-wechat ci
          npm run vendor:build

      - name: Verify project
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Verify pinned WeChat adapter
        run: npm --prefix vendor/cli-in-wechat test
