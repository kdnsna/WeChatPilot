version: 1
jobs:
  - id: daily-tech-digest
    name: 每日科技情报
    projectLabel: WeChatPilot
    executable: /opt/homebrew/opt/node@22/bin/node
    entrypoint: dist/src/cli/scheduled.js
    arguments:
      - --project-root
      - "{projectRoot}"
    workingDirectory: .
    timeoutMs: 1200000
    resultAdapter: scheduled-digest-json-v1
    allowedArtifactRoot: output
    notify: always
