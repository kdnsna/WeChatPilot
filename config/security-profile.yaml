version: 1
digestCodex:
  version: detected
  nodeExecutable: "{nodeExecutable}"
  javascriptEntrypoint: "{codexEntrypoint}"
  direct: true
  globalArgs: &digest-global
    - --search
    - --sandbox
    - read-only
    - --ask-for-approval
    - never
    - --cd
    - "{projectRoot}"
    - --disable
    - apps
    - --disable
    - plugins
    - --disable
    - hooks
    - --disable
    - browser_use
    - --disable
    - computer_use
    - --disable
    - in_app_browser
    - --disable
    - shell_tool
    - --disable
    - unified_exec
    - --disable
    - shell_snapshot
    - --disable
    - multi_agent
    - --disable
    - goals
    - --disable
    - code_mode_host
    - --disable
    - workspace_dependencies
    - --disable
    - chronicle
    - --disable
    - memories
    - --disable
    - image_generation
    - --disable
    - tool_suggest
    - --disable
    - auth_elicitation
  command: exec
  execArgs:
    - --ephemeral
    - --ignore-user-config
    - --ignore-rules
    - --color
    - never
    - --output-schema
    - "{projectRoot}/config/digest-output.schema.json"
    - "-"
  stdinOnly: true
  forbiddenArgs:
    - --dangerously-bypass-approvals-and-sandbox
    - --dangerously-bypass-hook-trust
    - --yolo
    - --add-dir
    - workspace-write
    - danger-full-access
    - --skip-git-repo-check
imageCodex:
  version: detected
  nodeExecutable: "{nodeExecutable}"
  javascriptEntrypoint: "{codexEntrypoint}"
  direct: true
  globalArgs:
    - --sandbox
    - read-only
    - --ask-for-approval
    - never
    - --cd
    - "{projectRoot}"
    - --enable
    - image_generation
    - --disable
    - apps
    - --disable
    - plugins
    - --disable
    - hooks
    - --disable
    - browser_use
    - --disable
    - computer_use
    - --disable
    - in_app_browser
    - --disable
    - shell_tool
    - --disable
    - unified_exec
    - --disable
    - shell_snapshot
    - --disable
    - multi_agent
    - --disable
    - goals
    - --disable
    - code_mode_host
    - --disable
    - workspace_dependencies
    - --disable
    - chronicle
    - --disable
    - memories
    - --disable
    - tool_suggest
    - --disable
    - auth_elicitation
  command: exec
  execArgs:
    - --ephemeral
    - --ignore-user-config
    - --ignore-rules
    - --color
    - never
    - --json
    - --output-schema
    - "{projectRoot}/config/report-image-output.schema.json"
    - "-"
